<svg width="400" height="900" viewBox="0 0 400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="900" rx="20" fill="#F9FAFB"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCFCE7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="150" fill="url(#grad1)" rx="20"/>

  <!-- Header -->
  <text x="50%" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">ScooPo</text>
  <text x="50%" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">专业宠物清洁收费方案</text>

  <!-- Offers Section -->
  <rect x="20" y="170" width="360" height="130" rx="15" fill="white" stroke="#E5E7EB"/>
  <text x="40" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">优惠活动</text>
  
  <circle cx="50" cy="230" r="8" fill="#FBBF24"/>
  <text x="65" y="235" font-family="Arial, sans-serif" font-size="14" fill="#374151">新客户：首单满 $50 立减 $10</text>
  
  <rect x="40" y="250" width="320" height="40" rx="8" fill="#F0F9FF"/>
  <text x="50" y="275" font-family="Arial, sans-serif" font-size="12" fill="#0369A1">4-7 次/周：享受 95折 - 9折 优惠</text>

  <!-- Pricing Tiers -->
  <rect x="20" y="320" width="360" height="120" rx="15" fill="white" stroke="#E5E7EB"/>
  <text x="40" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">基础版 (Essential)</text>
  <text x="320" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">$25/周</text>
  <text x="40" y="380" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">猫砂清理 • 区域吸尘 • 除臭喷雾</text>

  <rect x="20" y="460" width="360" height="120" rx="15" fill="white" stroke="#0891B2" stroke-width="2"/>
  <rect x="290" y="450" width="80" height="20" rx="10" fill="#0891B2"/>
  <text x="330" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">最受欢迎</text>
  <text x="40" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">优享版 (Premium)</text>
  <text x="320" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">$15/次</text>
  <text x="40" y="520" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">包含基础版 + 添粮换水 + 深度除臭</text>

  <rect x="20" y="600" width="360" height="120" rx="15" fill="white" stroke="#E5E7EB"/>
  <text x="40" y="630" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">尊享版 (Ultimate)</text>
  <text x="320" y="630" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">$20/次</text>
  <text x="40" y="660" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">包含优享版 + 猫砂盆周洗 + 喂食具清洁</text>

  <!-- Features -->
  <text x="50%" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827">我们的优势</text>
  <text x="50%" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">安全放心 • 宠物友好 • 定期反馈</text>

  <!-- Footer -->
  <line x1="40" y1="830" x2="360" y2="830" stroke="#E5E7EB" stroke-width="1"/>
  <text x="50%" y="865" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0891B2">不仅是清理，更是全方位的呵护</text>
</svg>
